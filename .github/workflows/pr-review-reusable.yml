name: PR Review Agent (Reusable)

on:
  workflow_call:
    secrets:
      BEDROCK_PROXY_URL:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Aivar-Siva/code-review-Agent
          path: agent-src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r agent-src/requirements.txt

      - name: Run PR Review Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEDROCK_PROXY_URL: ${{ secrets.BEDROCK_PROXY_URL }}
        run: python -m agent.main
        working-directory: agent-src
